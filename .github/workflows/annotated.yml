name: CI Annotated Example

on:
  push:
    branches: [main]   # agar tum master branch use kar rahe ho
  pull_request:
    branches: [main]

jobs:
  validate:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
